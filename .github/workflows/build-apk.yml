name: Build LinerNotes APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinerNotes-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "LinerNotes v1.0.2 (正式支持 Google Gemini 与一键预设)"
          body: |
            ## 🎵 LinerNotes (唱片内页) v1.0.2 升级版

            ### 🚀 重磅新增与优化：
            - ✨ **正式支持 Google Gemini API Key**：直接支持 Google AI Studio 免费申请的 Gemini API Key，并提供一键预设（Gemini 1.5 Flash / Gemini 2.0 Flash）！
            - 🤖 **全面兼容 OpenAI 格式大模型**：内置 Google Gemini、DeepSeek、OpenAI 等一键预设，亦可自定义填写通义千问、Kimi 等服务。
            - 🎼 **文学级逐行诗意歌词推敲**：中文与英文歌词保持严格逐行对应，并自动智能翻译单曲中文名称。
            - ⚙️ **更贴心的输入体验**：自动识别并补全 Gemini 官方接口地址，提供清晰的报错与网络提示。
            - 💿 **官方高清封面与全曲目同步**：支持从相册导入封面与 LRCLIB 全量歌词库智能搜索。

            **点击下方的 `app-debug.apk` 即可直接在手机上下载安装！**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
