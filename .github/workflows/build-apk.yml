name: Build LinerNotes APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace > build.log 2>&1 || {
            echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          }

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LinerNotes-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
