name: Build LinerNotes APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinerNotes-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "LinerNotes v1.0.1 (支持 AI 翻译与自定义 API Key)"
          body: |
            ## 🎵 LinerNotes (唱片内页) v1.0.1 升级版

            ### 🚀 重磅新增与修复：
            - 🤖 **全面支持自定义 AI 歌词翻译**：支持输入任意兼容 OpenAI 格式的 API Key（DeepSeek、OpenAI、Kimi、通义千问、硅基流动等）
            - 🎼 **AI 逐行文学级歌词推敲**：保留歌词韵律与结构，中英双语严格逐行对应，曲名自动汉化
            - ⚙️ **双入口便捷配置**：可在主页面右上角 ⚙️ 或歌词本内随时修改 API Key 与模型（默认推荐高性价比 DeepSeek）
            - 🛡️ **内置无感降级保护**：未填写 API Key 或网络波动时，自动降级为基础翻译，告别空译文
            - 💿 **官方高清封面与全曲目同步**：支持从相册自选照片与 LRCLIB 全量歌词库同步

            **点击下方的 `app-debug.apk` 即可直接在手机上下载安装！**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
